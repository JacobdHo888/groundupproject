<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroundUp | Financial Clarity Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: 'var(--accent)',
                            500: 'var(--accent)',
                            600: 'var(--accent)',
                        },
                        dark: {
                            bg: 'var(--bg-primary)',
                            card: 'var(--bg-card)',
                            border: 'var(--border)'
                        },
                        theme: {
                            text: 'var(--text-primary)',
                            muted: 'var(--text-secondary)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'shimmer': 'shimmer 1.5s infinite linear',
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '200% 0' },
                            '100%': { backgroundPosition: '-200% 0' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                            '50%': { opacity: .8, transform: 'scale(1.05)', filter: 'brightness(1.2)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        window.process = { env: { API_KEY: 'YOUR_API_KEY_HERE' } };
    </script>
        <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #00e676;
            --border: #2a2a2a;
        }
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #111111;
            --text-secondary: #666666;
            --accent: #00a854;
            --border: #e0e0e0;
        }
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-primary); 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        
        .shimmer-bg {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--border) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
        }

        /* Micro-animations */
        .hover-scale { transition: transform 0.15s ease, filter 0.15s ease; }
        .hover-scale:hover { transform: scale(1.02); filter: brightness(1.1); }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after { 
                animation-duration: 0.01ms !important; 
                animation-iteration-count: 1 !important; 
                transition-duration: 0.01ms !important; 
                scroll-behavior: auto !important; 
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
